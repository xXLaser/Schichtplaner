services:
  schichtwerk:
    build: .
    image: schichtwerk:latest
    container_name: schichtwerk
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "file:/app/data/dev.db"
      NODE_ENV: production
    volumes:
      - schichtwerk-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  schichtwerk-data:
