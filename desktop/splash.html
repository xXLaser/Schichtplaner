<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Schichtwerk</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        font-family: Segoe UI, system-ui, sans-serif;
        background: #f4f7f6;
        color: #134e4a;
      }
      .wrap {
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      h1 { margin: 0 0 8px; font-weight: 650; letter-spacing: -0.02em; }
      p { margin: 0; color: #5b6b69; }
      .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        margin: 18px 3px 0;
        border-radius: 50%;
        background: #0f766e;
        animation: pulse 1.1s infinite ease-in-out;
      }
      .dot:nth-child(2) { animation-delay: 0.15s; }
      .dot:nth-child(3) { animation-delay: 0.3s; }
      @keyframes pulse {
        0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); }
        40% { opacity: 1; transform: scale(1); }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div>
        <h1>Schichtwerk</h1>
        <p>Die Anwendung wird gestartet, bitte einen Moment warten…</p>
        <div>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>
    </div>
  </body>
</html>
